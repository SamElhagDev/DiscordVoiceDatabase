name: Discord Voice Database

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64]   # <- adjust labels if yours differ
    defaults:
      run:
        shell: powershell
    env:
      DiscordVoiceDatabase_APP_ROOT: C:\apps\DiscordVoiceDatabase          # persistent install location
      DiscordVoiceDatabase_APP_TASK: DiscordVoiceDatabase                  # Scheduled Task name
      DiscordVoiceDatabase_APP_PORT: 8080                                  # if your app uses PORT
      DiscordVoiceDatabase_TOKEN: ${{ secrets.DiscordVoiceDatabase_TOKEN }}
      DiscordVoiceDatabase_ROLE_ID: ${{ secrets.DiscordVoiceDatabase_ROLE_ID }}
      DiscordVoiceDatabase_VERSION: "1.0.0"
      DiscordVoiceDatabase_DB_PATH: C:\apps\DiscordVoiceDatabase\data\database.db
      DiscordVoiceDatabase_RECORDINGS_PATH: C:\apps\DiscordVoiceDatabase\recordings
      DiscordVoiceDatabase_CLIPS_PATH: C:\apps\DiscordVoiceDatabase\clips
      DiscordVoiceDatabase_RETENTION_DAYS: "365"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if (Test-Path 'requirements.txt') { python -m pip install -r requirements.txt }

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ensure ffmpeg is available
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "Installing ffmpeg via winget..."
            # Locate winget - it may not be in PATH for service/SYSTEM accounts
            $wingetExe = Get-Command winget -ErrorAction SilentlyContinue |
                         Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
            if (-not $wingetExe) {
              $wingetExe = Resolve-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" `
                             -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path
            }
            if (-not $wingetExe) {
              $wingetExe = Get-ChildItem "C:\Program Files\WindowsApps" -Recurse -Filter winget.exe `
                             -ErrorAction SilentlyContinue | Select-Object -Last 1 -ExpandProperty FullName
            }
            if (-not $wingetExe) { throw "winget.exe not found on this runner. Install App Installer from the Microsoft Store." }

            # winget's archive extractor (0x8A150004) requires an interactive
            # shell session it never has as SYSTEM. Redirect TEMP so the zip
            # lands in a known location, let winget download + verify the hash,
            # then extract the zip ourselves when winget fails at that step.
            $wtTemp = 'C:\winget-temp'
            New-Item -ItemType Directory -Path $wtTemp -Force | Out-Null
            $env:TEMP = $wtTemp
            $env:TMP  = $wtTemp

            & $wingetExe install --id Gyan.FFmpeg -e --scope machine `
              --accept-package-agreements --accept-source-agreements --silent
            $wingetExit = $LASTEXITCODE

            if ($wingetExit -eq -1978335140) {
              # Extraction failed - find the verified zip winget left in TEMP
              Write-Host "winget extraction failed (SYSTEM shell limitation); extracting zip manually..."
              $zip = Get-ChildItem $wtTemp -Recurse -Filter '*.zip' -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime | Select-Object -Last 1
              if (-not $zip) { throw "Could not find downloaded ffmpeg zip under $wtTemp" }

              $dest = 'C:\ffmpeg'
              Write-Host "Extracting $($zip.FullName) -> $dest ..."
              Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force

              # Zip contains a versioned subfolder; find ffmpeg.exe and use its parent
              $ffmpegExe = Get-ChildItem $dest -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
              if (-not $ffmpegExe) { throw "ffmpeg.exe not found after extraction" }
              $binDir = $ffmpegExe.DirectoryName

              # Persist bin dir to system PATH permanently
              $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
              if ($machinePath -notlike "*$binDir*") {
                [Environment]::SetEnvironmentVariable('Path', "$machinePath;$binDir", 'Machine')
              }
            } elseif ($wingetExit -ne 0) {
              throw "winget install failed with exit code $wingetExit"
            }

            # Reload PATH so ffmpeg is visible in this session
            $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                        [Environment]::GetEnvironmentVariable('Path','User')
          }
          Write-Host ((ffmpeg -version 2>&1)[0])

      - name: Create data directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:DiscordVoiceDatabase_DB_PATH.Replace('\database.db','') -Force | Out-Null
          New-Item -ItemType Directory -Path $env:DiscordVoiceDatabase_RECORDINGS_PATH -Force | Out-Null
          New-Item -ItemType Directory -Path $env:DiscordVoiceDatabase_CLIPS_PATH -Force | Out-Null

      # 1) Copy code to a persistent folder
      - name: Deploy files to persistent folder
        shell: powershell
        run: |
              New-Item -ItemType Directory -Path $env:DiscordVoiceDatabase_APP_ROOT -Force | Out-Null
              $dst = Join-Path $env:DiscordVoiceDatabase_APP_ROOT 'src'
              New-Item -ItemType Directory -Path $dst -Force | Out-Null
              robocopy "$env:GITHUB_WORKSPACE" "$dst" /MIR /NFL /NDL /NP /NJH /NJS /XD ".git" ".github" ".venv" "__pycache__" ".pytest_cache" ".mypy_cache" ".vs" ".vscode" "Publish" /XF "Dockerfile" "docker-compose.yml"
              $code = $LASTEXITCODE
              if ($code -ge 8) { Write-Error "robocopy failed with exit code $code"; exit $code }
              Write-Host "robocopy exit code $code (OK)"; exit 0

      # 2) Create a dedicated venv for runtime and install deps
      - name: Create/Update venv and install requirements
        run: |
          $venv = Join-Path $env:DiscordVoiceDatabase_APP_ROOT '.venv'
          $venvPy = "$venv\Scripts\python.exe"

          # If the venv exists, check its Python is still healthy.
          # A stale venv (e.g. created by a since-removed actions/setup-python
          # tool-cache Python) will have a broken base-python path baked into
          # pyvenv.cfg and will throw "No Python at ..." on every call.
          if (Test-Path $venv) {
            $healthy = $false
            try { $healthy = (& $venvPy --version 2>&1) -match 'Python 3' } catch {}
            if (-not $healthy) {
              Write-Host "Venv Python is stale or broken - recreating..."
              Remove-Item -Recurse -Force $venv
            }
          }

          if (-not (Test-Path $venv)) { py -3.10 -m venv $venv }
          & $venvPy -m pip install --upgrade pip wheel
          if (Test-Path "$env:DiscordVoiceDatabase_APP_ROOT\src\requirements.txt") {
            & $venvPy -m pip install -r "$env:DiscordVoiceDatabase_APP_ROOT\src\requirements.txt"
          }

      - name: Create run-bot.ps1 (no logging)
        shell: powershell
        run: |
              $app    = "$env:DiscordVoiceDatabase_APP_ROOT\src"
              $venvPy = "$env:DiscordVoiceDatabase_APP_ROOT\.venv\Scripts\python.exe"
              $lines = @()
              $lines += "`$ErrorActionPreference = 'Continue'"
              $lines += "Set-Location '$app'"
              $lines += "if (-not `$env:PORT) { `$env:PORT = '$env:DiscordVoiceDatabase_APP_PORT' }"
              # Fallback: only load .env if DiscordVoiceDatabase_TOKEN not already present
              $lines += 'if (-not $env:DiscordVoiceDatabase_TOKEN -and (Test-Path ".env")) {'
              $lines += '  Get-Content ".env" | ForEach-Object {'
              $lines += "    if (`$_ -match '^\s*#') { return }"
              $lines += "    if (`$_ -match '^\s*$') { return }"
              $lines += "    `$k,`$v = `$_ -split '=', 2"
              $lines += '    [Environment]::SetEnvironmentVariable($k.Trim(), $v.Trim())'
              $lines += '  }'
              $lines += '}'
              # Elevate this shell's process priority — Python inherits the class on Windows.
              # AboveNormal prevents the OS from throttling CPU and disk I/O for the bot.
              $lines += "try { [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'AboveNormal' } catch {}"
              $lines += "$venvPy -u bot.py"
              Set-Content -Path "$env:DiscordVoiceDatabase_APP_ROOT\run-bot.ps1" -Value ($lines -join "`r`n") -Encoding UTF8

      # Put the secrets into the machine environment so the Scheduled Task can read them
      - name: Set DiscordVoiceDatabase_TOKEN as machine env var
        shell: powershell
        env:
          DiscordVoiceDatabase_TOKEN: ${{ secrets.DiscordVoiceDatabase_TOKEN }}
        run: |
              if (-not $env:DiscordVoiceDatabase_TOKEN) { throw "Secret DiscordVoiceDatabase_TOKEN is missing. Add it in Settings → Secrets → Actions." }
              setx DiscordVoiceDatabase_TOKEN "$env:DiscordVoiceDatabase_TOKEN" /M | Out-Null
              $m = [Environment]::GetEnvironmentVariable('DiscordVoiceDatabase_TOKEN','Machine')
              if (-not $m) { throw "Failed to set machine env var DiscordVoiceDatabase_TOKEN." }

      - name: Set DiscordVoiceDatabase_PREFIX as machine env var
        shell: powershell
        env:
          DiscordVoiceDatabase_PREFIX: ${{ secrets.DiscordVoiceDatabase_PREFIX }}
        run: |
              if (-not $env:DiscordVoiceDatabase_PREFIX) { throw "Secret DiscordVoiceDatabase_PREFIX is missing. Add it in Settings → Secrets → Actions." }
              setx DiscordVoiceDatabase_PREFIX "$env:DiscordVoiceDatabase_PREFIX" /M | Out-Null
              $m = [Environment]::GetEnvironmentVariable('DiscordVoiceDatabase_PREFIX','Machine')
              if (-not $m) { throw "Failed to set machine env var DiscordVoiceDatabase_PREFIX." }

      - name: Set DiscordVoiceDatabase_INVITE_LINK as machine env var
        shell: powershell
        env:
          DiscordVoiceDatabase_INVITE_LINK: ${{ secrets.DiscordVoiceDatabase_INVITE_LINK }}
        run: |
              if (-not $env:DiscordVoiceDatabase_INVITE_LINK) { throw "Secret DiscordVoiceDatabase_INVITE_LINK is missing. Add it in Settings → Secrets → Actions." }
              setx DiscordVoiceDatabase_INVITE_LINK "$env:DiscordVoiceDatabase_INVITE_LINK" /M | Out-Null
              $m = [Environment]::GetEnvironmentVariable('DiscordVoiceDatabase_INVITE_LINK','Machine')
              if (-not $m) { throw "Failed to set machine env var DiscordVoiceDatabase_INVITE_LINK." }

      - name: Set DiscordVoiceDatabase_ROLE_ID as machine env var (optional)
        shell: powershell
        env:
          DiscordVoiceDatabase_ROLE_ID: ${{ secrets.DiscordVoiceDatabase_ROLE_ID }}
        run: |
              if ($env:DiscordVoiceDatabase_ROLE_ID) {
                setx DiscordVoiceDatabase_ROLE_ID "$env:DiscordVoiceDatabase_ROLE_ID" /M | Out-Null
                Write-Host "DiscordVoiceDatabase_ROLE_ID set."
              } else {
                Write-Host "DiscordVoiceDatabase_ROLE_ID not configured - all members can use bot commands."
              }

      - name: Set recording paths and version as machine env vars
        shell: powershell
        run: |
              setx DiscordVoiceDatabase_DB_PATH "$env:DiscordVoiceDatabase_DB_PATH" /M | Out-Null
              setx DiscordVoiceDatabase_RECORDINGS_PATH "$env:DiscordVoiceDatabase_RECORDINGS_PATH" /M | Out-Null
              setx DiscordVoiceDatabase_CLIPS_PATH "$env:DiscordVoiceDatabase_CLIPS_PATH" /M | Out-Null
              setx DiscordVoiceDatabase_RETENTION_DAYS "$env:DiscordVoiceDatabase_RETENTION_DAYS" /M | Out-Null
              setx DiscordVoiceDatabase_VERSION "$env:DiscordVoiceDatabase_VERSION" /M | Out-Null

    # Stop any existing bot so it doesn't keep running with old env
      - name: Stop existing bot (if running)
        shell: powershell
        run: |
              $name = $env:DiscordVoiceDatabase_APP_TASK
              if (Get-Command Stop-ScheduledTask -ErrorAction SilentlyContinue) {
              try { (Get-ScheduledTask -TaskName $name -ErrorAction Stop) | Stop-ScheduledTask -ErrorAction SilentlyContinue } catch {}
              } else {
              schtasks /end /tn $name 2>$null | Out-Null
              }
              # kill stray python from our app dir just in case
              $appDir = Join-Path $env:DiscordVoiceDatabase_APP_ROOT 'src'
              Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
              Where-Object { $_.CommandLine -match 'bot\.py' -and $_.CommandLine -match [regex]::Escape($appDir) } |
              ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } catch {} }

      # 5) Register a Scheduled Task (runs at startup, survives job end), then start it now
      - name: Register/Start Scheduled Task
        run: |
          $exe  = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $args = "-NoProfile -ExecutionPolicy Bypass -File `"$env:DiscordVoiceDatabase_APP_ROOT\run-bot.ps1`""
          $action    = New-ScheduledTaskAction -Execute $exe -Argument $args -WorkingDirectory $env:DiscordVoiceDatabase_APP_ROOT
          $trigger   = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries `
                                                    -Priority 4 `
                                                    -RestartCount 5 -RestartInterval (New-TimeSpan -Minutes 1) `
                                                    -ExecutionTimeLimit ([TimeSpan]::Zero)
          if (Get-ScheduledTask -TaskName $env:DiscordVoiceDatabase_APP_TASK -ErrorAction SilentlyContinue) {
            schtasks /end /tn $env:DiscordVoiceDatabase_APP_TASK 2>$null | Out-Null
            Unregister-ScheduledTask -TaskName $env:DiscordVoiceDatabase_APP_TASK -Confirm:$false
          }
          Register-ScheduledTask -TaskName $env:DiscordVoiceDatabase_APP_TASK -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
          # Fire it and return immediately (non-blocking)
          schtasks /run /tn $env:DiscordVoiceDatabase_APP_TASK | Out-Null

      # 6) (Optional) show status; logs are at C:\ProgramData\mybot.log
      - name: Task status
        run: schtasks /query /tn $env:DiscordVoiceDatabase_APP_TASK /v /fo LIST

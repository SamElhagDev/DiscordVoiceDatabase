services:
  discord-bot:
    build: .
    image: discord-voice-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/bot/data/database.db
      - RECORDINGS_PATH=/bot/recordings
      - CLIPS_PATH=/bot/clips
    volumes:
      # Persistent volumes — survive container restarts and rebuilds
      - bot-data:/bot/data
      - bot-recordings:/bot/recordings
      - bot-clips:/bot/clips
      # Log file (optional, bind mount)
      - ./discord.log:/bot/discord.log

volumes:
  bot-data:
  bot-recordings:
  bot-clips:
